# De controller en het dashboard: de componenten die geen stroom opwekken
# maar het net besturen en tonen. Ze verschillen op één punt bewust van
# elkaar: de controller draait met één replica, het dashboard met twee.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-controller
  namespace: grid
spec:
  # De controller mag geen twee instances draaien.
  # Ze zouden mekaar tegenwerken.
  # Verschillende controllers zou mogelijk werken met leader election.
  # Maar dat valt buiten de scope voor dit project.
  # Deze contoller mag sterven tijdens de test.
  # Bij het herstarten kijkt hij in de ConfigMap, daar staat onze stroomvraag opgeslagen.
  # Tijdens het herstarten:
  # - Alle pods blijven draaien.
  # - De stroomvraag kan tijdelijk niet aangepast worden.
  # - We kunnen niet bijsturen als bv de wind zou veranderen.
  # - Het dashboard krijgt geen data.
  replicas: 1
  selector:
    matchLabels:
      app: grid-controller
  template:
    metadata:
      labels:
        app: grid-controller
    spec:
      # Identiteit van de pod komt uit 00-namespace-rbac.yaml
      # Standaard zou de pod ServiceAccount gebruiken.
      # Maar die heeft geen rechten en zou error 403 geven bij API calls.
      serviceAccountName: grid-controller
      containers:
        - name: controller
          image: gridsim/grid-controller:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 30m
              memory: 48Mi
            limits:
              memory: 128Mi
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
---
# Service object die een vast intern adres geeft aan onze controler
# metadata.name + metadata.namespace = DNS voor de pod (http://grid-controller.grid.svc)
# Hierdoor blijft het adres van de controller altijd hetzelfde. 
# Ook als de pod op een andere node terechtkomt met een ander IP adres.
# Type ClusterIP zorgt ervoor dat deze service enkel in onze cluster beschikbaar is.
# Belangrijk want de controller heeft geen authenticatie. 
# Alle verkeer buiten onze cluster gaat via het dashboard, wat beveiligd is met een wachtwoord.
apiVersion: v1
kind: Service
metadata:
  name: grid-controller
  namespace: grid
spec:
  selector:
    app: grid-controller
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: grid
spec:
  # Hier wel twee replicas. Zodat we altijd een dashboard hebben ongeacht welke worker de shutdown krijgt.
  # Het dashboard is stateless dus twee instances werken elkaar niet tegen.  
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      # default ServiceAccount zonder rechten is ok hier.
      containers:
        - name: dashboard
          image: gridsim/dashboard:v2
          imagePullPolicy: IfNotPresent
          env:            
            - name: CONTROLLER_URL
              value: "http://grid-controller.grid.svc"            
            - name: PVE_NODE
              value: "proxmox"
          envFrom:
            - secretRef:
                name: dashboard-secrets
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      # Dashboard pods mogen nooit op dezelfde node komen.
      # Als een worker tijdelijk onbereikbaar is dan blijft de tweede dashboard pod Pending.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: dashboard
---
# De enige ingang van buitenaf. 
# NodePort in plaats van een Ingress
# NodePort opent poort 30080 op alle nodes en stuurt alles naar 1 service
# Hierdoor kunnen we het dashboard bereiken via elk node IP adres, ongeacht waar de pod draait.
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: grid
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
